# .github/workflows/send-announcement.yml
# TheCloseReport — One-time MF Launch Announcement
# Manual trigger ONLY — run once, then delete this file!

name: Send MF Launch Announcement

on:
  workflow_dispatch:    # manual trigger only — never runs automatically

jobs:
  send-announcement:
    name: Send MF Launch Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send MF launch announcement
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_SUBSCRIBERS: ${{ secrets.NEWSLETTER_SUBSCRIBERS }}
        run: python scripts/announcements/send_mf_launch.py